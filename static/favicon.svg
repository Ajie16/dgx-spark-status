<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#30d158;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0a84ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bf5af2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Dark rounded background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0a0a0a"/>
  <!-- Gauge arc -->
  <path d="M 32 12 A 20 20 0 1 1 31.9 12" fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="30"/>
  <!-- Gauge needle -->
  <line x1="32" y1="32" x2="44" y2="20" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="4" fill="#ffffff"/>
  <!-- Small tick marks -->
  <circle cx="16" cy="32" r="1.5" fill="#30d158" opacity="0.6"/>
  <circle cx="32" cy="16" r="1.5" fill="#0a84ff" opacity="0.6"/>
  <circle cx="48" cy="32" r="1.5" fill="#bf5af2" opacity="0.6"/>
  <circle cx="32" cy="48" r="1.5" fill="#ff9f0a" opacity="0.6"/>
</svg>
